[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-travel-planner-beeai"
version = "1.0.0"
description = "Production-ready multi-agent travel planner built with the BeeAI Framework — orchestration, ReAct, and robust error handling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Travel Planner Engineering" },
]
keywords = [
  "beeai",
  "multi-agent",
  "orchestration",
  "react",
  "travel-planner",
  "requirement-agent",
  "handoff",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "beeai-framework[wikipedia]>=0.1.60",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]
ollama = [
  "beeai-framework[ollama]>=0.1.60",
]

[project.scripts]
travel-planner = "travel_planner.cli:main"

[project.urls]
Homepage = "https://github.com/example/Multi-Agent-Travel-Planner-with-BeeAI"
Documentation = "https://github.com/example/Multi-Agent-Travel-Planner-with-BeeAI#readme"
BeeAI = "https://framework.beeai.dev/"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_planner"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["travel_planner"]
